services:
  mb-quant-web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      MB_QUANT_TRUST_PROXY_HEADERS: "true"
      MB_QUANT_ALLOWED_ORIGINS: ${MB_QUANT_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MB_QUANT_REQUESTS_PER_MINUTE: ${MB_QUANT_REQUESTS_PER_MINUTE:-30}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      caddy_shared:
        aliases:
          - mb-quant-web

  mb-quant-bot:
    profiles:
      - bot
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "telegram_bot.main"]
    environment:
      MB_QUANT_API_BASE_URL: http://mb-quant-web:8000/api
      TELEGRAM_ALIAS_DB_PATH: /app/data/telegram_aliases.sqlite3
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
    depends_on:
      mb-quant-web:
        condition: service_healthy
    volumes:
      - mb_quant_bot_data:/app/data
    networks:
      - caddy_shared

volumes:
  mb_quant_bot_data:

networks:
  caddy_shared:
    external: true
    name: ${CADDY_SHARED_NETWORK:?Set CADDY_SHARED_NETWORK to the shared Caddy network name}
