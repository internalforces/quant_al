services:
  mb-quant-web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      caddy_shared:
        aliases:
          - mb-quant-web

networks:
  caddy_shared:
    external: true
    name: ${CADDY_SHARED_NETWORK:-starterkit-prod_internal}
